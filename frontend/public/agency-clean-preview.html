<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="color-scheme" content="light"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agency-Clean</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#17171C;--canvas:#F4F3EF;--paper:#FFFFFF;--mist:#E9E8E3;--lilac:#DCD6FF;--sky:#D8EEF8;--peach:#FFD9CD;--mint:#D8F2E4;--line:#E5E3DE;--mute:#6E6D72;--on:#17171C;
--okb:#DFF2E6;--okt:#2F7A4E;--wb:#FFEFC8;--wt:#8A6A12;--eb:#FBE0DC;--et:#B04A3E;--ib:#D8EEF8;--it:#2E6C8A;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font:500 14px/1.5 Manrope,system-ui,sans-serif;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:"DM Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.04em}
.mute{color:var(--mute)}
#app{display:flex;min-height:100vh}
/* sidebar */
.side{width:256px;flex:none;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:24px 24px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;gap:12px;align-items:center;margin-bottom:32px}
.logo i{width:36px;height:36px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.logo i:after{content:"";width:16px;height:16px;border-radius:50%;border:3px solid var(--paper);box-shadow:inset 0 0 0 3px var(--ink)}
.logo b{font-size:18px;font-weight:700;display:block;line-height:1.1}
.logo small{color:var(--mute);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.nl{font:500 10px "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 8px 12px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--mute);font-size:14px}
.nav button:hover{background:var(--mist);color:var(--ink)}
.nav button.on{background:var(--ink);color:var(--canvas)}
.nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #6B5FC7;outline-offset:2px}
.nav .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--peach)}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sf{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.mini{border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.bar{height:5px;border-radius:9px;background:var(--mist);overflow:hidden}.bar i{display:block;height:100%;background:var(--ink);border-radius:9px}
.me{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.av{width:34px;height:34px;border-radius:50%;background:var(--peach);color:var(--on);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
/* main */
main{flex:1;min-width:0}
.top{display:flex;gap:16px;align-items:center;padding:16px 32px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.crumb{color:var(--mute);white-space:nowrap}.crumb b{color:var(--ink);font-weight:600}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;background:var(--mist);border-radius:14px;padding:0 14px;height:42px;color:var(--mute)}
.search input{all:unset;flex:1;color:var(--ink)}
.seg{display:flex;background:var(--mist);border-radius:14px;padding:4px;gap:2px;margin-left:auto;overflow-x:auto}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:10px;font-weight:600;font-size:13px;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.menu{display:none}
#view{padding:32px;max-width:1280px;margin:0 auto}
h1{font-size:34px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.035em}
h2{font-size:20px;margin:0;font-weight:600;letter-spacing:-.025em}
.eb{display:inline-block;font:500 10px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;background:var(--mist);border-radius:8px;padding:4px 8px;color:var(--mute);margin:0 4px 12px 0}
.ph{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap}
.ph p{margin:6px 0 0;color:var(--mute);max-width:620px}
/* cards & controls */
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:24px;position:relative;overflow:hidden}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:12px;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);white-space:nowrap}
.btn.p{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.btn.t{background:var(--mist);border-color:transparent}
.btn.sm{height:30px;padding:0 12px;border-radius:10px;font-size:12px}
.btn.dg{color:var(--et)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--mist);color:var(--on)}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--okb);color:var(--okt)}.pill.wn{background:var(--wb);color:var(--wt)}.pill.er{background:var(--eb);color:var(--et)}.pill.in{background:var(--ib);color:var(--it)}.pill.lc{background:var(--lilac);color:#4A3FA8}
.tag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font:500 10px "DM Mono",monospace;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--on);margin-right:6px}
.tag.pe{background:var(--peach)}.tag.lc{background:var(--lilac)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font:500 10px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:0 12px 12px}
td{padding:14px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}
.ra{display:flex;gap:6px;justify-content:flex-end}
.chip{width:32px;height:32px;border-radius:10px;flex:none;display:inline-grid;place-items:center;margin-right:12px;vertical-align:middle;color:var(--on)}
.note{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:14px 16px;background:var(--ib);color:var(--it);font-weight:600;margin-bottom:16px}
.note.wn{background:var(--wb);color:var(--wt)}
.note.ok{background:var(--okb);color:var(--okt)}
.empty{text-align:center;padding:56px 16px}.empty .chip{width:56px;height:56px;border-radius:50%;margin:0 0 16px;background:var(--lilac)}
.fl{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fl label{display:flex;justify-content:space-between;font-weight:600;font-size:13px}
.fl label span{font:400 10px "DM Mono",monospace;color:var(--mute)}
.fl input,.fl select,.fl textarea{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:11px 14px;min-height:44px;width:100%}
.fl textarea{min-height:84px;resize:vertical}
.fl.bad input,.fl.bad select,.fl.bad textarea{border-color:var(--et)}
.fl small{color:var(--mute);font-size:12px}.fl.bad small{color:var(--et);font-weight:600}
.sw{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.sw input{width:auto;min-height:0;accent-color:#17171C}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.ov{position:fixed;inset:0;background:rgba(23,23,28,.45);display:grid;place-items:center;z-index:20;padding:16px;overflow:auto}
.dlg{background:var(--paper);border-radius:24px;border:1px solid var(--line);width:min(620px,100%);padding:28px;max-height:92vh;overflow:auto}
.dlg h2{margin-bottom:4px}
.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:10px 16px;margin:20px 0}.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:600;word-break:break-word}
pre{background:var(--ink);color:var(--canvas);border-radius:16px;padding:16px;overflow:auto;font:400 12px/1.6 "DM Mono",monospace;margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--canvas);padding:12px 20px;border-radius:14px;font-weight:700;z-index:30}
.sk{height:16px;border-radius:8px;background:var(--mist);margin:14px 0;animation:p 1.1s infinite alternate}
@keyframes p{to{opacity:.4}}
/* dashboard shapes */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:20px}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:20px}
.big{font-size:56px;font-weight:700;letter-spacing:-.05em;line-height:1;margin:12px 0}.big small{font-size:18px;font-weight:500;letter-spacing:-.01em;color:var(--mute);margin-left:8px}
.sep{border-top:1px solid var(--line);padding-top:16px;margin-top:24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.orbit{position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:#FFE9E2;border:1px solid var(--peach)}
.orbit:before{content:"";position:absolute;inset:34px;border-radius:50%;border:1px dashed #F5B9A7}
.orbit:after{content:"★";position:absolute;left:52px;bottom:52px;width:26px;height:26px;border-radius:50%;background:var(--peach);display:grid;place-items:center;font-size:11px;color:#17171C}
.arch{position:absolute;right:0;top:12px;width:108px;height:170px;background:var(--lilac);border-radius:54px 54px 0 0;display:grid;place-items:center}
.arch i{width:62px;height:108px;background:#F2EFFF;border-radius:31px 31px 0 0;display:block;position:relative}.arch i:after{content:"";position:absolute;left:25px;top:42px;width:12px;height:12px;border-radius:50%;background:var(--on)}
.tk:before,.tk:after{content:"";position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:var(--canvas);border:1px solid var(--line);margin-top:-10px}
.tk:before{left:-11px}.tk:after{right:-11px}
.dash{border-top:1px dashed var(--line);margin:16px 0}
.burst{position:absolute;right:20px;top:18px;width:38px;height:38px;background:var(--mint);display:grid;place-items:center;font:500 11px "DM Mono",monospace;color:var(--on);clip-path:polygon(50% 0,62% 14%,80% 10%,84% 28%,100% 38%,90% 54%,98% 72%,80% 78%,72% 96%,54% 88%,38% 100%,32% 82%,12% 80%,16% 62%,0 48%,16% 36%,14% 18%,34% 20%)}
.tb{display:grid;grid-template-columns:220px 1fr 80px 50px;gap:12px;align-items:center;padding:9px 0}.tb .bar{height:6px}
.dark{background:#17171C;color:#F4F3EF;border-color:#17171C;margin-top:20px}
.dark h2{font-size:24px;line-height:1.15;margin:8px 0 12px}.dark p{color:#BDBCC4;margin:0}.dark .tag{background:transparent;color:#F4F3EF;border-color:#55555E}
.dark .ring{position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:1px solid #3A3A44}
.sty{display:flex;gap:14px;margin-top:20px}.sty i{display:block;width:44px;height:56px}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);width:100%}
.al{display:flex;flex-direction:column;justify-content:center;padding:48px;max-width:520px;margin:0 auto;width:100%}
.ar{background:#17171C;color:#F4F3EF;margin:16px;border-radius:32px;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.ar h2{font-size:44px;line-height:1.05;letter-spacing:-.04em;font-weight:600;max-width:340px}
.shapes{display:flex;gap:18px;align-items:flex-end}.shapes div{flex:none}
.rolechips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 24px}
.rolechips button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-weight:700;font-size:12px}
.rolechips button.on{background:var(--lilac);border-color:var(--lilac);color:#17171C}
a.lk{color:var(--ink);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
@media(max-width:1000px){.g3,.g2,.auth,.pg{grid-template-columns:1fr}.ar{display:none}.tb{grid-template-columns:1fr 80px}.tb .bar,.tb .mono:last-child{display:none}}
@media(max-width:860px){.side{position:fixed;left:0;z-index:15;transform:translateX(-100%);transition:transform .2s;padding-top:calc(24px + env(safe-area-inset-top,0px))}.side.open{transform:none}.menu{display:inline-grid}.top{padding:12px 16px;flex-wrap:wrap}.seg{margin-left:0;width:100%}#view{padding:20px 16px}.crumb{display:none}.kv{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}.side{transition:none}}

.bh{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--paper);border-radius:24px;padding:20px 24px;margin-bottom:28px}
.bh .lg{width:56px;height:56px;border-radius:14px;background:var(--peach);display:grid;place-items:center;font-weight:700;color:#C0614A}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;border-radius:24px;padding:22px 24px;display:flex;flex-direction:column;gap:6px;min-height:160px}
.tile:focus-visible{outline:2px solid #6B5FC7;outline-offset:2px}
.tile b{font-size:15px}.tile .ti{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.6);display:grid;place-items:center;margin-bottom:auto}
.tile .cnt{color:#4A3FA8;font-weight:700;font-size:13px;margin-top:4px}
@media(max-width:700px){.tiles{grid-template-columns:1fr}}
.rd{display:flex;flex-direction:column;gap:2px;border-radius:16px;padding:14px 16px;background:#FFEFE8;border:1px solid var(--peach);margin-bottom:16px}.rd:empty{display:none}
.obh{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.ban{background:var(--peach);border-radius:16px;padding:12px 20px}
.pbar{height:6px;border-radius:9px;background:var(--mist);overflow:hidden;width:180px}.pbar i{display:block;height:100%;background:#E8806A}
.secg{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.secg{grid-template-columns:1fr}}
.secbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;font-weight:600}.secbtn:hover{background:var(--canvas)}.secbtn:focus-visible{outline:2px solid #6B5FC7;outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px}.stat b{display:block;font-size:26px;letter-spacing:-.04em}.stat.al b{color:var(--et)}.tc{display:flex;flex-direction:column;gap:10px}.tb2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.tb2 select{border:1px solid var(--line);border-radius:12px;padding:7px 10px;background:#fff}.avs{display:flex}.avs .av{width:28px;height:28px;font-size:10px;margin-left:-6px;border:2px solid #fff}.avs .av:first-child{margin-left:0}.ck{display:flex;gap:8px;flex-wrap:wrap}.ck label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:600;font-size:12px}
</style></head>
